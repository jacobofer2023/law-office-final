<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="quiz.css" />
  <title>Quiz - Game</title>
</head>

<body>
  <div class="main">
    <h1 id="scors">
      <span>SCORE: <span id="span" class="span_score">0</span></span>
      <span id="timerDisplay">00:00</span>
      <button id="startBtn" onclick="playAndStart()">התחל</button>
    </h1>
    <audio id="startSound" src="sounds/timer.wav"></audio>
    <div class="question" id="question">
      <h2 id="ques-title">שאלות</h2>
      <h3 class="sub_title">בחר בתשובה הנכונה ביותר</h3>
      <p id="case-text" class="case-description"></p>
      <p id="que" class="actual-question"></p>
      <ul id="answers">
        <li id="ans1"></li>
        <li id="ans2"></li>
        <li id="ans3"></li>
        <li id="ans4"></li>
      </ul>
    </div>
  </div>
  <script src="quiz.js"></script>
</body>

</html>
